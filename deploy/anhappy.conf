# 静态资源缓存策略:按后缀映射 Cache-Control
map $uri $cache_control {
    ~*\.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|eot|ico)$  "public, max-age=2592000";
    default                                                      "no-cache";
}

# wardogs 地图瓦片/地形数据懒缓存(反代作者 Cloudflare,总量上限 1g,半年未访问自动淘汰)
proxy_cache_path /var/cache/nginx/wardogs-tiles levels=1:2 keys_zone=wd_tiles:20m
                 max_size=1g inactive=180d use_temp_path=off;

# anhappy.com 主站配置 — 2026-09-15 重建(2026-09-18 copyparty 退役,/files/ 系旧地址跳 /fbq/)
# 结构:http/www/IP → 301 裸域;/:主页;/blog/:Hexo;/share/:书库(fancyindex);
#      /fbq/:FileBrowser Quantum;/twikoo/:评论API;/stats/:goaccess(公开);/source/:博客素材(不再列目录)

# ---------- 80:证书验证 + 全部跳 https ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name anhappy.com www.anhappy.com 104.243.20.24 _;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location ^~ /.well-known/pki-validation/ { alias /opt/services/ssl-verify/.well-known/pki-validation/; }

    location / { return 301 https://anhappy.com$request_uri; }
}

# ---------- www → 裸域 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.anhappy.com 104.243.20.24;

    ssl_certificate     /etc/nginx/ssl/anhappy/positivessl-fullchain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    ssl_certificate_key /etc/nginx/ssl/anhappy/positivessl.key;

    return 301 https://anhappy.com$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;          # HTTP/3(QUIC,UDP 443;跨洋丢包链路提速,客户端不可达自动回落 h2)
    listen [::]:443 quic reuseport;
    http2 on;
    server_name anhappy.com;

    ssl_certificate     /etc/nginx/ssl/anhappy/positivessl-fullchain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    ssl_certificate_key /etc/nginx/ssl/anhappy/positivessl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    charset utf-8;
    add_header Cache-Control $cache_control;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;   # 告知浏览器可用 HTTP/3

    # --- 性能:gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # ===== 证书验证(https 侧也放行)=====
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location ^~ /.well-known/pki-validation/ { alias /opt/services/ssl-verify/.well-known/pki-validation/; }

    # ===== 旧地址 301 兼容 =====
    location ~ ^/posts(/|$)            { return 301 /blog$request_uri; }
    location ~ ^/(archives|categories|tags|link|search|page)(/|$) { return 301 /blog$request_uri; }
    # 2026-09-18 copyparty 退役后改道:/files/ 系与 /filebrowser 旧地址 → /fbq/;统计报告 → /stats/
    # (一律 302 防 301 永久缓存,见 SERVER-PROFILE §13-1)
    location = /filebrowser             { return 302 /fbq/; }
    location /filebrowser/              { return 302 /fbq/; }
    location = /files                   { return 302 /fbq/; }
    location /files/                    { return 302 /fbq/; }
    location = /twikoo84                { return 301 /twikoo/; }
    location ~ ^/twikoo84/(.*)$         { return 301 /twikoo/$1; }
    location = /html/report.html        { return 302 /stats/; }

    # ===== 主页 =====
    location / {
        root  /opt/services/homepage;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ===== 博客(Hexo 静态产物)=====
    location /blog/ {
        error_page 404 /blog/404.html;
        alias /opt/services/www/blog/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ===== 旧书库链接兼容 =====
    location ~ ^/share/books/(.*)$ { return 301 /share/$1; }

    # ===== 公开书库(fancyindex 主题)=====
    location /share/ {
        alias /opt/data/books/;
        fancyindex on;
        fancyindex_localtime on;
        fancyindex_exact_size off;
        fancyindex_name_length 500;
        fancyindex_header "/html/Nginx-Fancyindex-Theme/header.html";
        fancyindex_footer "/html/Nginx-Fancyindex-Theme/footer.html";
        fancyindex_ignore "Nginx-Fancyindex-Theme";
    }

    # ===== fancyindex 主题与静态资源(沿用旧 /html 路径)=====
    location /html/ {
        alias /opt/services/www/theme/;
        index index.html;
    }

    # ===== 博客素材(直接文件可访问,不再开目录列表)=====
    location /source/ {
        alias /opt/services/www/source/;
        autoindex off;
    }

    # ===== twikoo 评论 API(沿用旧透传方式)=====
    location /twikoo/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ===== WARDOGS 火炮计算器(纯静态镜像,2026-09-17)=====
    location = /wardogs { return 301 /wardogs/; }
    location = /wardogs/ { return 302 /wardogs/zh-cn/; }
    location /wardogs/ {
        alias /opt/services/wardogs/dist/;
        index index.html;
        try_files $uri $uri/ =404;
        # 缓存头继承全局 map(静态 30 天/HTML no-cache);不写 add_header 以继承 server 级安全头
    }

    # ===== WARDOGS 瓦片/地形:R2 反代 + 本地懒缓存(同源化,绕开 CORS)=====
    # /wardogs/r2/<路径> → https://assets.wardogs-artillery.com/releases/<路径>
    location /wardogs/r2/ {
        proxy_pass https://assets.wardogs-artillery.com/releases/;
        proxy_ssl_server_name on;
        proxy_ssl_name assets.wardogs-artillery.com;
        proxy_set_header Host assets.wardogs-artillery.com;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;

        proxy_cache wd_tiles;
        proxy_cache_key "$proxy_host$request_uri";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ===== WT 载具统计站(纯静态镜像,2026-09-17)=====
    # 前端=上游 web 分支出厂产物(免构建)+3 处补丁(见 dist/SOURCE.md);
    # 数据=data-current 符号链接 → data/vYYYYmmdd-HHMMSS/,update.sh 每日检查、随上游每 3 天换版
    location = /wtstats { return 301 /wtstats/; }
    location /wtstats/ {
        alias /opt/services/wtstats/dist/;
        index index.html;
        try_files $uri $uri/ =404;
        gzip_static on;      # 吃预压 .gz(bundle.js / i18n json / wasm 等)
        brotli_static on;    # 吃预压 .br(比 gzip 再小 ~15-20%,浏览器优先用)
    }
    location /wtstats/data/ {
        # 数据 CSV 均 gzip -9 / brotli q10 双预压(metadata 与 CSV 走全局 map 默认 no-cache,保证日期列表新鲜)
        alias /opt/services/wtstats/data-current/;
        gzip_static on;
        brotli_static on;
    }

    # ===== WT 载具数据库 /wtapi/(静态 JSON 树,2026-09-19)=====
    # 零常驻内存:4 端点静态化(vehicles/<id>.json + vehicles.json + identifiers.json + stats.json)+ 官方图 357MB;
    # 管线在本机 E:\ah\wtapi-build\(datamine 稀疏克隆 → WT-Vehicle-Data-Extract → export_static.py → tar 上传),
    # 换版 = 传 releases/<ver>/ + 原子换 current 符号链接,nginx 无需 reload;运维手册 /root/docs/wtapi-deploy-plan/
    location = /wtapi { return 301 /wtapi/; }
    location /wtapi/ {
        alias /opt/services/wtapi/current/;
        index index.html;
        try_files $uri $uri/ =404;
        # 缓存头继承全局 map(index.html no-cache / 图片 30 天);JSON 的短缓存 override 见 /wtapi/api/
    }
    location /wtapi/api/ {
        alias /opt/services/wtapi/current/api/;
        # location 级 add_header 会清掉 server 级继承,安全头须整套重声明(先例=/wardogs/r2/ 块);
        # API JSON 数据随游戏大版本(约 2-3 个月)同 URL 更新 → 短缓存 5 分钟(上游官方同款值)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ===== WT 研发点计算器 /wtrp/(纯静态原创,2026-09-19)=====
    # 零后端零构建:app 运行时 fetch /wtapi/ 的 vehicles-full/names-zh/statcard 图 + 本地 data/trees.json(shop.blkx 布局)
    # 源码在本机 E:\ah\wtrp\(git 仓,MIT);数据换版=gen_data.py+gen_catalog.py(手册 /root/docs/wtrp-deploy-plan/);前端换版=上传五件套+bump index.html 的 ?v= 版本号
    location = /wtrp { return 301 /wtrp/; }
    location /wtrp/ {
        alias /opt/services/wtrp/;
        index index.html;
        try_files $uri $uri/ =404;
        # 页面/JS/CSS 一律 no-cache(location 级 add_header 会清掉 server 级继承,安全头须整套重声明,先例=/wtrp/data/ 块);
        # 换版必须 bump index.html 里 ?v= 版本号:浏览器可能已按全局 map 把旧 JS/CSS 存了 30 天,同 URL 不会重新校验(v4.1 教训)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;
    }
    location /wtrp/data/ {
        alias /opt/services/wtrp/data/;
        # trees.json 换版同 URL 更新(2-3 个月一次),覆盖为 no-cache+ETag 保新鲜(先例=wtstats 数据)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;
    }

    # ===== WT 活动总览 /wtevents/(纯静态,2026-09-26 M1 上线)=====
    # 数据=官方新闻档(2011 起)+官方 Wiki 活动年表+datamine 活动车;管线在本机 E:\ah\wtevents-build\;运维手册 /root/docs/wtevents-deploy-plan/
    # 载具图运行时引用 /wtapi/assets/(零拷贝);events.json 随构建更新→全 no-cache
    location = /wtevents { return 301 /wtevents/; }
    location /wtevents/ {
        alias /opt/services/wtevents/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;
    }

    # ===== FileBrowser Quantum 文件管理(正式,2026-09-18 转正;copyparty 同日退役)=====
    # 127.0.0.1:8085,应用侧 baseURL=/fbq(config.yaml);SSE 实时(非 websocket,无需 Upgrade 头,需 buffering off)
    location /fbq/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 4096m;
    }

    # ===== goaccess stats (v4): fbq-gated via auth_request; unauth 302 -> /stats-login/ mini page (fbq login API, cookie Path=/) -> back to report =====
    location = /_fbq_auth {
        internal;
        proxy_pass http://127.0.0.1:8085/fbq/api/resources?path=%2F&source=files;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /stats  { return 302 /stats/report.html; }
    location = /stats/ { return 302 /stats/report.html; }
    location /files/stats/report.html { return 302 /stats/report.html; }
    location /stats/ {
        alias /opt/data/stats/;
        auth_request /_fbq_auth;
        error_page 401 = @stats_login;
        error_page 403 = @stats_login;
    }
    location @stats_login { return 302 /stats-login/; }
    location = /stats-login { return 302 /stats-login/; }
    location /stats-login/ { alias /opt/services/homepage/stats-login/; index index.html; }
}
